[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-experiments"
version = "0.1.0"
description = "MoE routing dynamics during CoT reasoning — experiments"
requires-python = ">=3.11"
dependencies = [
    # torch is intentionally excluded here — install with CUDA support first:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu128
    "transformers>=5.5.0,<6",
    "accelerate>=0.30.0",
    "datasets>=2.20.0",
    "tokenizers>=0.22.2",
    "kernels==0.11.7",  # API compatible with Transformers 5.5 hub-kernel registration
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "jsonlines>=4.0.0",
    "huggingface-hub>=0.24.0",
    "bitsandbytes>=0.46.1",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "math-verify[antlr4_13_2]>=0.9.0,<1",
]

[project.scripts]
gepa-llm-as-judge = "labeling.gepa.run:main"
correlation-generate = "generation.generate_answers:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
gepa-llm-as-judge = [
    "dspy>=3.0.0,<4",
    "gepa>=0.0.27",
]
unsloth = [
    "unsloth==2026.8.18",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
