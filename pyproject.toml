[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-experiments"
version = "0.1.0"
description = "MoE routing dynamics during CoT reasoning — experiments"
requires-python = ">=3.11"
dependencies = [
    # torch is intentionally excluded here — install with CUDA support first:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu128
    "transformers>=4.57.1",
    "accelerate>=0.30.0",
    "datasets>=2.20.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "jsonlines>=4.0.0",
    "huggingface-hub>=0.24.0",
    "bitsandbytes>=0.46.1",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "math-verify[antlr4_13_2]>=0.9.0,<1",
]

[project.scripts]
gepa-llm-as-judge = "moe_exp.gepaLLMAsJudge.run:main"
gepa-llm-as-judge-audit = "moe_exp.gepaLLMAsJudge.audit:main"
old-exp1 = "moe_exp.old.experiment1.run:main"
probe-test = "moe_exp.probeTest.run:main"
correlation-generate = "moe_exp.correlation_pipeline.generate:main"
correlation-forward = "moe_exp.correlation_pipeline.extract:main"
correlation-analyze = "moe_exp.correlation_pipeline.analyze:main"
moe-guiding = "moe_exp.moe_guiding.run:main"

[project.entry-points."vllm.general_plugins"]
moe_guiding = "moe_exp.moe_guiding.plugin:register"

[project.optional-dependencies]
moe-guiding = [
    "vllm",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
gepa-llm-as-judge = [
    "dspy>=3.0.0,<4",
    "gepa>=0.0.27",
]
probe = [
    "gptqmodel==7.3.1",
    "torchvision==0.26.0",
]
unsloth = [
    "unsloth==2026.8.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moe_exp"]

[tool.ruff]
line-length = 100
target-version = "py311"
